name: Build and verify MP3
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - name: Install pinned compiler
        shell: pwsh
        run: |
          $archive = Join-Path $env:RUNNER_TEMP 'llvm-mingw.zip'
          Invoke-WebRequest 'https://github.com/mstorsjo/llvm-mingw/releases/download/20261104/llvm-mingw-20261104-ucrt-x86_64.zip' -OutFile $archive
          $digest = (Get-FileHash -LiteralPath $archive -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($digest -ne '552191b5754c49a5a20723276a6fc56541ea1922c4c50b7b669022333fc1b40f') { throw 'Compiler checksum mismatch' }
          $destination = Join-Path $env:RUNNER_TEMP 'compiler'
          Expand-Archive -LiteralPath $archive -DestinationPath $destination
          $compiler = Get-ChildItem -LiteralPath $destination -Directory -Filter 'llvm-mingw*' | Select-Object -First 1
          "EXELIGHT_LLVM=$($compiler.FullName)" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Build dependencies and DLL
        shell: pwsh
        run: |
          python build_vendors.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python build_project.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Standalone verification
        shell: pwsh
        run: |
          $checks = @('run_mp3_checks.py','run_optimization_checks.py','run_stability_checks.py','run_ui_checks.py','run_runtime_checks.py','privacy_checks.py','verify_artifact.py')
          foreach ($check in $checks) {
            python $check
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: MP3-verified
          if-no-files-found: error
          path: |
            build/exelight7-3.2.4-MXT111-MP3.dll
            build/verification.json
            build/privacy-scan.json
